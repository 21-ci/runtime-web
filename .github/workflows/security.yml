# Security: pull requests, pushes to main, weekly.
#
#   trivy      filesystem scan (vuln, secret, misconfig); SARIF to code scanning; fails on HIGH/CRITICAL
#   npm-audit  npm audit --omit=dev for web and server (production dependencies only)
#   codeql     javascript-typescript (security-extended)
#   scorecard  OpenSSF Scorecard (main and schedule only; publishes to the public API)
#
# Accepted findings go in .trivyignore with an expiry and a reason.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1

jobs:
  trivy:
    name: trivy fs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Trivy (SARIF, all severities, for code scanning)
        run: >-
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore
          --skip-dirs node_modules,web/node_modules,server/node_modules,docs/ui-reference
          --format sarif --output trivy.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
      - name: Trivy gate (HIGH/CRITICAL fail)
        run: >-
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore
          --skip-dirs node_modules,web/node_modules,server/node_modules,docs/ui-reference
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [web, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (runtime deps)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high
      # Dev deps (vitest, vite, ...) run on CI runners and developer machines: high/critical fails too.
      - name: npm audit (all deps, including dev)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  scorecard:
    name: scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
