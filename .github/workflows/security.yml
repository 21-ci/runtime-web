# Security: pull requests, pushes to main, weekly.
#
#   trivy      filesystem scan (vuln, secret, misconfig); SARIF to code scanning; fails on HIGH/CRITICAL
#   npm-audit  npm audit --omit=dev for web and server (production dependencies only)
#   codeql     javascript-typescript (security-extended)
#   gitleaks   full git history; reviewed false positives in .gitleaksignore
#   semgrep    p/typescript, p/javascript, p/react, p/nodejsscan, p/secrets, p/github-actions; blocks on ERROR
#   osv-scanner  web and server lockfiles; any known vulnerability fails
#   scorecard  OpenSSF Scorecard (main and schedule only; publishes to the public API)
#   workflows  zizmor (workflow security, medium and up) and actionlint (syntax, shellcheck on run: blocks)
#
# Accepted findings go in .trivyignore with an expiry and a reason; secret and semgrep exclusions in .gitleaksignore
# and .semgrepignore.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy fs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1 # keep in step with the other workflow
      - name: Trivy (SARIF, all severities, for code scanning)
        run: >-
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore
          --skip-dirs node_modules,web/node_modules,server/node_modules,docs/ui-reference
          --format sarif --output trivy.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
      - name: Trivy gate (HIGH/CRITICAL fail)
        run: >-
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore
          --skip-dirs node_modules,web/node_modules,server/node_modules,docs/ui-reference
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [web, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (runtime deps)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high
      # Dev deps (vitest, vite, ...) run on CI runners and developer machines: high/critical fails too.
      - name: npm audit (all deps, including dev)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built from its tagged module, like gitleaks and actionlint: the Go checksum database is verified.
      - name: Install osv-scanner v2.7.0
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: osv-scanner (web and server lockfiles, any known vulnerability fails)
        run: |
          "$RUNNER_TEMP/bin/osv-scanner" scan --lockfile web/package-lock.json --lockfile server/package-lock.json

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary, built from its tagged module (Go checksum database verified), not gitleaks-action:
      # that action needs a paid license for organisations. Reviewed false positives: .gitleaksignore.
      - name: Install gitleaks v8.30.1
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: gitleaks (full history)
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/semgrep.txt
      # Test files are excluded in .semgrepignore. Blocks on ERROR only; WARNING findings are reported in the logs.
      - name: semgrep scan (blocks on ERROR severity)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --metrics=off \
            --config p/typescript --config p/javascript --config p/react --config p/nodejsscan \
            --config p/secrets --config p/github-actions \
            --sarif-output=semgrep.sarif --severity ERROR --error
      # semgrep keeps `nosemgrep` findings in the SARIF (marked as suppressed) and code scanning would
      # still raise them as alerts, so they are dropped before upload.
      - name: drop suppressed findings from the SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  scorecard:
    name: scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  workflows:
    name: zizmor + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          min-severity: medium
      # Built with the runner's Go toolchain at a pinned version.
      - name: Install actionlint v1.7.12
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$RUNNER_TEMP/bin/actionlint" -color'
