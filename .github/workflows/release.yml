# Release: runs on a vX.Y.Z tag pushed by a maintainer (docs/contributing/ci-cd.md).
#
#   build    web (vite) + server bundle into runtime-web-<ver>.tar.gz:
#              runtime-web-<ver>/server/   service source (src/, sdk/), scripts/install.mjs, rt.json, package*.json
#              runtime-web-<ver>/web/dist/ the built console (embedded into the service by install.mjs)
#              runtime-web-<ver>/deploy/   Caddyfile, rt.rtweb.toml
#              runtime-web-<ver>/install.sh, VERSION
#            reproducible tarball (SOURCE_DATE_EPOCH, sorted, numeric owner 0), SPDX SBOM (syft), trivy scan of the
#            unpacked tree and the SBOM: any fixable HIGH/CRITICAL blocks the release
#   release  SHA256SUMS + cosign keyless bundle (SHA256SUMS.sigstore.json) + SLSA build provenance, GitHub Release with
#            the CHANGELOG section as notes (scripts/release-notes.sh)
#   verify   downloads what was published and checks checksum, signature and attestation
#
# No signing key is stored: cosign and the attestation use the workflow's GitHub OIDC identity.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TRIVY_VERSION: v0.76.1
  CERT_IDENTITY_REGEXP: ^https://github\.com/21-ci/runtime-web/\.github/workflows/release\.yml@refs/tags/v
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Version from the tag
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::bad tag $tag"; exit 1; }
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - name: Tag matches server/package.json and web/package.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for p in server/package.json web/package.json; do
            have=$(node -p "require('./$p').version")
            [ "$have" = "$VERSION" ] || { echo "::error::$p version $have does not match tag v$VERSION"; exit 1; }
          done
      - name: Required release inputs exist
        run: |
          for f in server/scripts/install.mjs server/scripts/gen-assets.mjs server/sdk/rtctl/mod.ts server/rt.json deploy/Caddyfile deploy/rt.rtweb.toml install.sh; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
      # No dependency cache in releases: a cache restored from another ref could poison the bundle.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test and build web
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Test server
        working-directory: server
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: Assemble the tarball
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.source_date_epoch }}
        run: |
          name="runtime-web-$VERSION"
          root="dist/stage/$name"
          mkdir -p "$root/server" "$root/web" "$root/deploy" dist/out
          cp -R server/src server/sdk server/scripts "$root/server/"
          rm -rf "$root/server/src/gen"
          cp server/rt.json server/package.json server/package-lock.json "$root/server/"
          cp -R web/dist "$root/web/dist"
          cp deploy/Caddyfile deploy/rt.rtweb.toml "$root/deploy/"
          cp install.sh "$root/install.sh"
          chmod 0755 "$root/install.sh"
          printf '%s\n' "$VERSION" > "$root/VERSION"
          find "$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C dist/stage -cf - "$name" | gzip -n -9 > "dist/out/$name.tar.gz"
          cp install.sh dist/out/install.sh
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/stage
          format: spdx-json
          output-file: dist/out/runtime-web-${{ steps.v.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Trivy scan of the artifact (HIGH/CRITICAL fixable block)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          trivy fs --scanners vuln,secret,misconfig --ignorefile .trivyignore \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 dist/stage
          trivy sbom --ignorefile .trivyignore --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "dist/out/runtime-web-$VERSION.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/out/
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/out
      - name: SHA256SUMS
        working-directory: dist/out
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign-blob SHA256SUMS (keyless bundle)
        run: cosign sign-blob --yes --bundle dist/out/SHA256SUMS.sigstore.json dist/out/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/out/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Runtime Web $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $flags dist/out/*

  verify:
    name: verify
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" --certificate-oidc-issuer "$CERT_OIDC_ISSUER" SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          gh attestation verify "runtime-web-$VERSION.tar.gz" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
