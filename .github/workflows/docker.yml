# Container image: ghcr.io/21-ci/runtime-web (Dockerfile; docs/getting-started/docker.md).
#
#   lint     hadolint (Dockerfile) -> SARIF
#   image    per flavor (distroless, slim), linux/amd64 + linux/arm64. Every stage that runs a command runs on the build
#            platform (cross-compiled Go, architecture-independent web build), so no QEMU is needed.
#            pull request: multi-arch build without push, then the amd64 image loaded and gated by Trivy
#            main / vX.Y.Z tag: pushed by digest with SBOM + provenance (mode=max), Trivy per platform (SARIF + gate:
#            fixable HIGH/CRITICAL blocks), only then tagged (edge / X.Y.Z / X.Y, "-slim" for slim), cosign keyless
#            signed and attested (build provenance + SPDX SBOM)
#
# No signing key is stored: cosign and the attestations use the workflow's GitHub OIDC identity.
name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/21-ci/runtime-web

jobs:
  lint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: warning
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  image:
    name: image ${{ matrix.flavor }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: distroless, suffix: "" }
          - { flavor: slim, suffix: "-slim" }
    env:
      PUSH: ${{ github.event_name == 'push' }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Version and build date
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; else version="edge-${GITHUB_SHA::12}"; fi
          {
            echo "version=$version"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        name: Build (multi-arch; on push by digest, untagged until the scans pass)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.source_date_epoch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true', env.IMAGE) || 'type=cacheonly' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: ${{ env.PUSH == 'true' && format('type=gha,mode=max,scope={0}', matrix.flavor) || '' }}
      - name: Load the amd64 image for the pull request scan
        if: env.PUSH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.flavor }}
          platforms: linux/amd64
          tags: runtime-web:pr-${{ matrix.flavor }}
          load: true
          cache-from: type=gha,scope=${{ matrix.flavor }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1 # keep in step with security.yml
      - name: Trivy (SARIF of fixable findings, and gate on fixable HIGH/CRITICAL)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$PUSH" = true ]; then
            for p in amd64 arm64; do
              trivy image --quiet --platform "linux/$p" --scanners vuln,secret --ignore-unfixed --ignorefile .trivyignore \
                --format sarif --output "trivy-$p.sarif" "$IMAGE@$DIGEST"
              trivy image --quiet --platform "linux/$p" --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
                --ignorefile .trivyignore --exit-code 1 "$IMAGE@$DIGEST" || fail=1
            done
          else
            trivy image --quiet --scanners vuln,secret --ignore-unfixed --ignorefile .trivyignore \
              --format sarif --output trivy-amd64.sarif "runtime-web:pr-$FLAVOR"
            trivy image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore --exit-code 1 "runtime-web:pr-$FLAVOR" || fail=1
          fi
          exit "$fail"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-amd64.sarif') != ''
        with:
          sarif_file: trivy-amd64.sarif
          category: image-${{ matrix.flavor }}-amd64
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-arm64.sarif') != ''
        with:
          sarif_file: trivy-arm64.sarif
          category: image-${{ matrix.flavor }}-arm64
      - name: Tag the scanned digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tags for $GITHUB_REF"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: cosign sign (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: env.PUSH == 'true'
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.flavor }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.flavor }}.spdx.json
          push-to-registry: true
      - name: Verify the signature
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
