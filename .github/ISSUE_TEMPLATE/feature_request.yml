name: Feature request
description: Propose a new capability or a change in behavior.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Large changes (a breaking API change, a new trust boundary, a new storage migration) follow the proposal
        process in [GOVERNANCE.md](https://github.com/21-ci/runtime-web/blob/main/GOVERNANCE.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior, page, endpoint or setting you would like. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this touch authentication, authorization, secrets or tenant isolation?
