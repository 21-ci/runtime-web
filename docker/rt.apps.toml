# Earlier default plan for org tenants in the container image, kept for tenants created on it. New orgs get the
# `unlimited` plan from rt.rtweb.toml (RTWEB_DEFAULT_PLAN); set RTWEB_DEFAULT_PLAN=apps to keep using this one,
# or define your own with RTWEB_RT_CONFIG_EXTRA (another [plans.<name>] table).
[plans.apps]
rps = 50
max_concurrency = 10
invocations_per_day = 100000
max_services = 20
max_schedules = 10
min_schedule_seconds = 60
storage_mb = 256
allowed_triggers = ["http", "interval", "cron", "queue", "call", "websocket"]
limits_max = { wall_ms = 30000, cpu_ms = 2000, memory_mb = 128 }
