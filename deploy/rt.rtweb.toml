# Runtime Web fragment for the node's rt.toml (docs/contributing/architecture.md D2, D4).
# Merge into rt.toml, export RTWEB_OP_TOKEN and RTWEB_RELAY_SECRET in the node's environment, then
# restart rt (SIGHUP reloads plans and bindings). server/scripts/install.mjs checks both and prints this
# reminder when missing. Unknown keys fail startup: keep to the documented keys.
#   RTWEB_OP_TOKEN      the full Authorization value for the operator token: "Bearer <RT_ROOT_TOKEN>"
#                       (the runtime has a single operator credential, the root token; inject_headers sends
#                       the value verbatim). install.sh derives it from the rt environment file.
#   RTWEB_RELAY_SECRET  64 random hex chars, the same value Caddy's relay compares (never empty).
#
# The node must also trust Caddy on loopback for X-Forwarded-For, or every client IP reads 127.0.0.1:
#   [ingress]
#   trusted_proxies = ["127.0.0.1/32", "::1/128"]
# install.sh adds that to an existing [ingress] table (a second [ingress] here would break the merge).

[plans.rtweb]
# The console tenant serves its own JS, fonts and API: one page load is ~30 invocations, so the
# default plan (rps 50 with an equal burst, 10 in flight, 100k a day) throttles normal use.
# Login and TOTP keep their own per-account limits. 0 = no daily cap.
rps = 300
max_concurrency = 64
invocations_per_day = 0
max_services = 2
max_schedules = 3
min_schedule_seconds = 60
storage_mb = 1024
allowed_triggers = ["http", "interval", "cron", "call"]
limits_max = { wall_ms = 30000, cpu_ms = 2000, memory_mb = 128 }

# Default plan for org tenants (install.sh and the container set RTWEB_DEFAULT_PLAN=unlimited): no quota of its
# own. rt reads 0 as "no limit" only for rps, invocations_per_day, max_concurrency, max_instances,
# max_warm_floor_total and the socket caps; every other quota counts down from its value (0 would allow nothing),
# so those are set far above any real use. limits_max is per task and is still clamped by the node's own maxima.
# To limit tenants, define your own [plans.<name>] and set RTWEB_DEFAULT_PLAN (install.sh --default-plan).
[plans.unlimited]
rps = 0
invocations_per_day = 0
max_concurrency = 0
max_instances = 0
max_warm_floor_total = 0
max_sockets = 0
max_sockets_per_object = 0
max_services = 1000000
max_schedules = 1000000
min_schedule_seconds = 1
storage_mb = 1073741824
egress_mb_per_day = 1073741824
builds_per_hour = 1000000
max_queue_depth = 1000000000
allowed_triggers = ["http", "interval", "cron", "queue", "call", "websocket"]
limits_max = { wall_ms = 900000, cpu_ms = 900000, memory_mb = 4096 }

# Operator routes, called with the root/operator token. Reachable only from the rtctl SDK service.
[[binding]]
name            = "rtctl-op"
base_url        = "http://127.0.0.1:8081"
inject_headers  = { authorization = "env:RTWEB_OP_TOKEN" }
allowed_plans   = ["rtweb"]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]
allowed_paths   = ["/v1/tenants", "/v1/tenants/*", "/v1/plans", "/v1/plans/*", "/v1/node/*", "/v1/version", "/v1/hosts", "/v1/hosts/*", "/v1/services/*/hosts/*"]
rate_limit      = { rps = 50, burst = 100 }

# Tenant-scoped routes through the Caddy relay (:8082), which maps x-rtweb-key -> Authorization.
[[binding]]
name            = "rtctl-tenant"
base_url        = "http://127.0.0.1:8082"
inject_headers  = { x-relay-auth = "env:RTWEB_RELAY_SECRET" }
allowed_plans   = ["rtweb"]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]
allowed_paths   = ["/v1/services", "/v1/services/*", "/v1/projects", "/v1/projects/*", "/v1/keys", "/v1/keys/*", "/v1/tenants/*/usage", "/v1/me", "/v1/limits"]
rate_limit      = { rps = 100, burst = 200 }
