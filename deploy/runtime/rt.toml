# runtime-copy node config used by docker-compose.yml (mounted at /etc/rt/rt.toml).
# Overrides only what Runtime Web needs; everything else is the image default (profile balanced).
# Environment overrides win over this file (docs/config.md, RT__SECTION__KEY):
#   RT__ROUTING__BASE_DOMAIN is set from BASE_DOMAIN in docker-compose.yml.

[routing]
# Dev default; overridden by RT__ROUTING__BASE_DOMAIN (= BASE_DOMAIN from .env).
base_domain = "apps.localhost"

[ingress]
# rtrouter's fixed address on the compose network (172.28.0.10). Its X-Forwarded-For is believed,
# so guest apps see the browser's address as x-rt-client-ip.
trusted_proxies = ["172.28.0.10/32"]

# Plan assigned to every tenant created by Runtime Web (RUNTIME_DEFAULT_PLAN=standard).
# Sized for the smoke suite and the budget run: >= 50 services, >= 50 schedules per service.
[plans.standard]
max_services = 50
max_schedules = 50
min_schedule_seconds = 1
allowed_triggers = ["http", "interval", "cron", "queue", "call"]
