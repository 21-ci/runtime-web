# CI overlay: exercises the ACME (TLS) path of rtrouter against Pebble, the Let's Encrypt test CA.
#
#   docker compose -f docker-compose.yml -f deploy/compose.pebble.yml up -d --build --wait
#
# Pebble validates challenges without DNS or port reachability (PEBBLE_VA_ALWAYS_VALID), so the
# router issues certificates for {slug}.BASE_DOMAIN and the console host from inside the network.
# The router must trust Pebble's minica root: copy /test/certs/pebble.minica.pem out of the pebble
# container into the router-data volume and point SSL_CERT_FILE at it (CI does this before `up`).
# Pebble's image tag is pinned here; bump deliberately.
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:v2.7.0
    command: ["-config", "/test/config/pebble-config.json", "-strict"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_VA_ALWAYS_VALID: "1"
    networks:
      web:
    restart: unless-stopped

  rtrouter:
    environment:
      ROUTER_TLS: "on"
      ROUTER_HTTP_ADDR: ":80"
      ROUTER_HTTPS_ADDR: ":443"
      ROUTER_ACME_CA: "https://pebble:14000/dir"
      SSL_CERT_FILE: /data/pebble-root/pebble.minica.pem
      ACME_EMAIL: "ci@example.net"
    ports: !override
      - "127.0.0.1:${ROUTER_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${ROUTER_HTTPS_PORT:-8443}:443"
    depends_on:
      - pebble
